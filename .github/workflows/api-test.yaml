name: API CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "api-test.yaml"
  pull_request:
    paths:
      - "apps/api/**"
      - "api-test.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Run tests
        run: go test ./...
