TradeDate:
  type: string
  format: date
  description: 取引日（YYYY-MM-DD）。JSON表現に合わせGoでも文字列を使用する。
  x-go-type: string
  example: '2026-10-19'
DecimalString:
  type: string
  description: 精度を保持するため文字列で返す10進数。
  example: '110.5'
PingResponse:
  type: object
  required: [message]
  properties:
    message:
      type: string
      example: pong
ErrorResponse:
  type: object
  required: [message]
  properties:
    message:
      type: string
      description: エラーメッセージ。
