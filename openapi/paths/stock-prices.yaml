get:
  operationId: getDailyPrices
  summary: 銘柄の株価日足を取得する
  parameters:
    - name: symbol
      in: path
      required: true
      description: 銘柄コード（例：13010）。
      schema:
        type: string
  responses:
    '200':
      description: 取引日の昇順。対象がなければ空配列。
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../schemas/daily-price.yaml#/DailyPriceResponse'
    '500':
      $ref: '../responses/common.yaml#/InternalServerError'
