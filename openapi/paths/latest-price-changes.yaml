get:
  operationId: getLatestDailyPriceChanges
  summary: 最新の保存済み取引日の騰落率を取得する
  description: |
    daily_pricesの最も新しい取引日を使用する。市場の最新営業日や取り込み完了を保証しない。
    比較元は銘柄ごとの対象日より前の直近の保存済み日足とし、必ずしも前営業日ではない。
    比較元がある全銘柄を返し、並べ替え・件数制限は行わない。
    会社名は現在の銘柄マスターから取得し、マスター未登録の銘柄も会社名をnullとして返す。
  responses:
    '200':
      description: DBが空なら日付はnullで一覧は空配列。対象日の結果が空でも日付は維持する。
      content:
        application/json:
          schema:
            $ref: '../schemas/daily-price-change.yaml#/LatestDailyPriceChangesResponse'
    '500':
      $ref: '../responses/common.yaml#/InternalServerError'
