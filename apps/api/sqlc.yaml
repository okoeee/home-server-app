version: "2"

sql:
  - engine: "mysql"
    schema: "../database/mysql/init/table_schema.sql"
    queries: "query"
    gen:
      go:
        package: "db"
        out: "db"
        emit_interface: true
        overrides:
          - db_type: "decimal"
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
          - db_type: "decimal"
            unsigned: true
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
